name: Deploy Intertalk

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create .env.local from secrets
        run: |
          echo "NEXT_PUBLIC_GEMINI_API_KEY=${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY }}" > .env.local

      - name: Archive application
        run: |
          git archive --format=tar.gz -o app.tgz HEAD

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload app to VPS
        run: |
          scp app.tgz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/intertalk

      - name: Deploy on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd /var/www/intertalk

            tar -xzf app.tgz
            rm app.tgz

            npm install
            npm run build

            pm2 restart intertalk || pm2 start npm --name intertalk -- start
            pm2 save
